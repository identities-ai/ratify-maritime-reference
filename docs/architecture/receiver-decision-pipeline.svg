<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Receiver-owned authorization decision pipeline</title>
  <desc id="desc">Six receiver-owned stages validate transport identity, resolve a single-use proof reference, snapshot inputs, verify Ratify authority, apply local policy, and invoke the handler only after allow.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#667085"/></marker><style>.t{font:700 34px Inter,Arial,sans-serif;fill:#101828}.s{font:400 17px Inter,Arial,sans-serif;fill:#475467}.n{font:700 15px Inter,Arial,sans-serif;fill:#6172f3}.h{font:700 18px Inter,Arial,sans-serif;fill:#101828}.p{font:400 14px Inter,Arial,sans-serif;fill:#475467}.b{fill:#fff;stroke:#98a2b3;stroke-width:2}.v{fill:#ecfdf3;stroke:#12b76a;stroke-width:2}.x{fill:#101828}.w{fill:#fff}.l{stroke:#667085;stroke-width:3;marker-end:url(#a)}.d{stroke:#d92d20;stroke-width:2;stroke-dasharray:7 6}.deny{font:700 14px Inter,Arial,sans-serif;fill:#b42318}.foot{font:600 15px Inter,Arial,sans-serif;fill:#344054}</style></defs>
  <rect width="1600" height="620" fill="#fff"/><text x="65" y="65" class="t">The handler is the last stage—not the place authorization begins</text><text x="65" y="100" class="s">Every input is caller-bound, bounded, snapshotted, and independently verified before a business effect.</text>
  <g transform="translate(65 175)"><rect width="210" height="150" rx="16" class="b"/><text x="22" y="32" class="n">01</text><text x="22" y="66" class="h">Authenticate caller</text><text x="22" y="97" class="p">Bearer credential maps to</text><text x="22" y="120" class="p">receiver-owned caller ID</text></g>
  <g transform="translate(315 175)"><rect width="210" height="150" rx="16" class="b"/><text x="22" y="32" class="n">02</text><text x="22" y="66" class="h">Resolve reference</text><text x="22" y="97" class="p">Single-use proof record</text><text x="22" y="120" class="p">matches caller and action</text></g>
  <g transform="translate(565 175)"><rect width="210" height="150" rx="16" class="b"/><text x="22" y="32" class="n">03</text><text x="22" y="66" class="h">Snapshot inputs</text><text x="22" y="97" class="p">Closed action schema and</text><text x="22" y="120" class="p">exact proof types copied</text></g>
  <g transform="translate(815 175)"><rect width="210" height="150" rx="16" class="v"/><text x="22" y="32" class="n">04</text><text x="22" y="66" class="h">Verify Ratify</text><text x="22" y="97" class="p">Issuer, subject, scope,</text><text x="22" y="120" class="p">bounds, time and replay</text></g>
  <g transform="translate(1065 175)"><rect width="210" height="150" rx="16" class="v"/><text x="22" y="32" class="n">05</text><text x="22" y="66" class="h">Apply local policy</text><text x="22" y="97" class="p">Receiver ceiling may be</text><text x="22" y="120" class="p">narrower than delegation</text></g>
  <g transform="translate(1315 175)"><rect width="220" height="150" rx="16" class="x"/><text x="22" y="32" class="n">06</text><text x="22" y="66" class="h w">Protected handler</text><text x="22" y="97" class="p w">Observable business effect</text><text x="22" y="120" class="p w">only after ALLOW</text></g>
  <path d="M275 250h32M525 250h32M775 250h32M1025 250h32M1275 250h32" class="l"/>
  <path d="M170 325v100M420 325v100M670 325v100M920 325v100M1170 325v100" class="d"/>
  <text x="95" y="458" class="deny">DENY</text><text x="345" y="458" class="deny">DENY</text><text x="595" y="458" class="deny">DENY</text><text x="845" y="458" class="deny">DENY</text><text x="1095" y="458" class="deny">DENY</text>
  <rect x="65" y="505" width="1470" height="58" rx="14" fill="#fef3f2" stroke="#fecdca"/><text x="100" y="541" class="foot">Every denial returns a stable reason code and leaves the protected-handler invocation count unchanged.</text>
</svg>
