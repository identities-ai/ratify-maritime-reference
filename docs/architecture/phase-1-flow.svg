<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Maritime and Ratify Phase 1 authority flow</title>
  <desc id="desc">A principal delegates bounded authority to an agent in Maritime. A Ratify interceptor obtains a challenge, uploads a proof, receives a one-time reference, and calls a separately configured MCP receiver. Verification and local policy run before the protected handler.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#566176"/></marker>
    <marker id="allow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b8f68"/></marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#101828}.sub{font:400 18px Inter,Arial,sans-serif;fill:#475467}.zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.zoneTitle{font:700 18px Inter,Arial,sans-serif;fill:#344054;letter-spacing:.5px}.box{fill:#fff;stroke:#98a2b3;stroke-width:2}.accent{fill:#eef4ff;stroke:#6172f3}.verify{fill:#ecfdf3;stroke:#12b76a}.handler{fill:#101828;stroke:#101828}.h1{font:700 18px Inter,Arial,sans-serif;fill:#101828}.p{font:400 15px Inter,Arial,sans-serif;fill:#475467}.white{fill:#fff}.line{fill:none;stroke:#566176;stroke-width:3;marker-end:url(#arrow)}.allowLine{fill:none;stroke:#0b8f68;stroke-width:4;marker-end:url(#allow)}.dash{fill:none;stroke:#d92d20;stroke-width:3;stroke-dasharray:9 8}.step{font:700 14px Inter,Arial,sans-serif;fill:#344054}.pill{fill:#f2f4f7;stroke:#d0d5dd}.small{font:600 13px Inter,Arial,sans-serif;fill:#475467}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="70" class="title">Authority crosses the runtime boundary without entering the prompt</text>
  <text x="70" y="108" class="sub">Maritime isolates where the agent runs. Ratify controls what its selected action may do.</text>

  <rect x="55" y="155" width="250" height="570" rx="22" class="zone"/>
  <text x="82" y="195" class="zoneTitle">PRINCIPAL</text>
  <rect x="82" y="250" width="196" height="155" rx="16" class="box accent"/>
  <text x="106" y="295" class="h1">Bounded delegation</text>
  <text x="106" y="330" class="p">Site: Seattle warehouse</text><text x="106" y="355" class="p">Category: electrical</text><text x="106" y="380" class="p">Limit: 500 USD</text>
  <rect x="91" y="455" width="178" height="42" rx="21" class="pill"/><text x="118" y="482" class="small">Issuer key stays here</text>

  <rect x="340" y="155" width="500" height="570" rx="22" class="zone"/>
  <text x="368" y="195" class="zoneTitle">MARITIME ISOLATED AGENT RUNTIME</text>
  <rect x="375" y="245" width="430" height="125" rx="16" class="box"/>
  <text x="405" y="290" class="h1">LangChain agent</text><text x="405" y="325" class="p">Model sees business arguments only</text>
  <rect x="375" y="455" width="430" height="175" rx="16" class="box accent"/>
  <text x="405" y="500" class="h1">Ratify MCP interceptor</text>
  <text x="405" y="535" class="p">Canonicalizes the selected action</text><text x="405" y="560" class="p">Signs challenge outside model context</text><text x="405" y="585" class="p">Carries only a short reference on the tool call</text>
  <path d="M590 370 L590 447" class="line"/><text x="610" y="415" class="step">selected tool</text>

  <rect x="875" y="155" width="670" height="570" rx="22" class="zone"/>
  <text x="903" y="195" class="zoneTitle">SEPARATELY CONFIGURED RECEIVER RUNTIME</text>
  <rect x="910" y="235" width="275" height="92" rx="14" class="box"/><text x="938" y="272" class="h1">Challenge endpoint</text><text x="938" y="300" class="p">Exact action + caller bound</text>
  <rect x="1235" y="235" width="275" height="92" rx="14" class="box"/><text x="1263" y="272" class="h1">Bounded proof upload</text><text x="1263" y="300" class="p">17,966-byte proof in body</text>
  <rect x="910" y="390" width="275" height="105" rx="14" class="box"/><text x="938" y="430" class="h1">One-time registry</text><text x="938" y="458" class="p">Caller + subject + action + TTL</text>
  <rect x="1235" y="390" width="275" height="105" rx="14" class="box"/><text x="1263" y="430" class="h1">MCP work-order tool</text><text x="1263" y="458" class="p">Business schema + opaque ref</text>
  <rect x="910" y="560" width="275" height="105" rx="14" class="box verify"/><text x="938" y="600" class="h1">Ratify + local policy</text><text x="938" y="628" class="p">Verify the same snapshots</text>
  <rect x="1235" y="560" width="275" height="105" rx="14" class="handler"/><text x="1263" y="600" class="h1 white">Protected handler</text><text x="1263" y="628" class="p white">Entered only on ALLOW</text>

  <path d="M805 500 C850 500 860 280 902 280" class="line"/><circle cx="842" cy="390" r="15" fill="#fff" stroke="#566176" stroke-width="2"/><text x="837" y="396" class="step">1</text>
  <path d="M902 315 C850 345 850 470 805 520" class="line"/><circle cx="870" cy="355" r="15" fill="#fff" stroke="#566176" stroke-width="2"/><text x="865" y="361" class="step">2</text>
  <path d="M805 550 C920 550 1080 350 1227 285" class="line"/><circle cx="1060" cy="380" r="15" fill="#fff" stroke="#566176" stroke-width="2"/><text x="1055" y="386" class="step">3</text>
  <path d="M1235 315 C1165 340 1120 355 1050 382" class="line"/><circle cx="1145" cy="349" r="15" fill="#fff" stroke="#566176" stroke-width="2"/><text x="1140" y="355" class="step">4</text>
  <path d="M805 590 C970 760 1260 520 1260 503" class="line"/><circle cx="955" cy="665" r="15" fill="#fff" stroke="#566176" stroke-width="2"/><text x="950" y="671" class="step">5</text>
  <path d="M1235 442 L1195 442" class="line"/><path d="M1047 495 L1047 552" class="line"/><path d="M1185 612 L1227 612" class="allowLine"/>
  <path d="M1040 665 C1040 748 1370 750 1370 674" class="dash"/><text x="1110" y="782" class="step">DENY returns a stable reason; handler count stays unchanged</text>

  <rect x="70" y="810" width="18" height="18" rx="4" class="accent"/><text x="100" y="824" class="small">Ratify authority construction</text>
  <rect x="350" y="810" width="18" height="18" rx="4" class="verify"/><text x="380" y="824" class="small">Receiver-owned authorization</text>
  <rect x="655" y="810" width="18" height="18" rx="4" class="handler"/><text x="685" y="824" class="small">Protected business effect</text>
</svg>
