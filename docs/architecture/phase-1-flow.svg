<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Maritime and Ratify Phase 1 authority flow</title>
  <desc id="desc">A principal delegates bounded authority to an agent in Maritime. A Ratify interceptor obtains a challenge, uploads a proof, receives a one-time reference, and calls a separately configured MCP receiver. Verification and local policy run before the protected handler.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M1,1 L11,6 L1,11 Z" fill="#566176"/></marker>
    <marker id="allow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M1,1 L11,6 L1,11 Z" fill="#0b8f68"/></marker>
    <marker id="deny" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M1,1 L11,6 L1,11 Z" fill="#d92d20"/></marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#101828}.sub{font:400 18px Inter,Arial,sans-serif;fill:#475467}.zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.zoneTitle{font:700 18px Inter,Arial,sans-serif;fill:#344054;letter-spacing:.5px}.box{fill:#fff;stroke:#98a2b3;stroke-width:2}.accent{fill:#eef4ff;stroke:#6172f3}.verify{fill:#ecfdf3;stroke:#12b76a}.handler{fill:#101828;stroke:#101828}.h1{font:700 18px Inter,Arial,sans-serif;fill:#101828}.p{font:400 15px Inter,Arial,sans-serif;fill:#475467}.white{fill:#fff}.line{fill:none;stroke:#566176;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.allowLine{fill:none;stroke:#0b8f68;stroke-width:4;stroke-linecap:round;marker-end:url(#allow)}.denyLine{fill:none;stroke:#d92d20;stroke-width:3;stroke-linecap:round;stroke-dasharray:9 8;marker-end:url(#deny)}.step{font:700 14px Inter,Arial,sans-serif;fill:#344054}.pill{fill:#f2f4f7;stroke:#d0d5dd}.small{font:600 13px Inter,Arial,sans-serif;fill:#475467}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="70" class="title">Authority crosses the runtime boundary without entering the prompt</text>
  <text x="70" y="108" class="sub">Maritime isolates where the agent runs. Ratify controls what its selected action may do.</text>

  <rect x="55" y="155" width="250" height="570" rx="22" class="zone"/>
  <text x="82" y="195" class="zoneTitle">PRINCIPAL</text>
  <rect x="82" y="250" width="196" height="155" rx="16" class="box accent"/>
  <text x="180" y="295" class="h1" text-anchor="middle">Bounded delegation</text>
  <text x="180" y="330" class="p" text-anchor="middle">Site: Seattle warehouse</text><text x="180" y="355" class="p" text-anchor="middle">Category: electrical</text><text x="180" y="380" class="p" text-anchor="middle">Limit: 500 USD</text>
  <rect x="91" y="455" width="178" height="42" rx="21" class="pill"/><text x="118" y="482" class="small">Issuer key stays here</text>

  <rect x="340" y="155" width="465" height="570" rx="22" class="zone"/>
  <text x="368" y="195" class="zoneTitle">MARITIME ISOLATED AGENT RUNTIME</text>
  <rect x="375" y="245" width="395" height="125" rx="16" class="box"/>
  <text x="405" y="290" class="h1">LangChain agent</text><text x="405" y="325" class="p">Model sees business arguments only</text>
  <rect x="375" y="455" width="395" height="175" rx="16" class="box accent"/>
  <text x="405" y="500" class="h1">Ratify MCP interceptor</text>
  <text x="405" y="535" class="p">Canonicalizes the selected action</text><text x="405" y="560" class="p">Signs challenge outside model context</text><text x="405" y="585" class="p">Carries only a short reference on the tool call</text>
  <path d="M590 370 L590 447" class="line"/><text x="610" y="415" class="step">selected tool</text>

  <rect x="900" y="155" width="645" height="570" rx="22" class="zone"/>
  <text x="928" y="195" class="zoneTitle">SEPARATELY CONFIGURED RECEIVER RUNTIME</text>
  <rect x="955" y="225" width="300" height="90" rx="14" class="box"/><text x="983" y="262" class="h1">Challenge endpoint</text><text x="983" y="290" class="p">Binds caller + exact action</text>
  <rect x="955" y="365" width="300" height="90" rx="14" class="box"/><text x="983" y="402" class="h1">Bounded proof upload</text><text x="983" y="430" class="p">Proof travels in the body</text>
  <rect x="955" y="505" width="300" height="90" rx="14" class="box"/><text x="983" y="542" class="h1">MCP work-order tool</text><text x="983" y="570" class="p">Business action + opaque ref</text>
  <rect x="1290" y="365" width="220" height="90" rx="14" class="box"/><text x="1318" y="402" class="h1">One-time registry</text><text x="1318" y="430" class="p">Caller + action + TTL</text>
  <rect x="1290" y="505" width="220" height="90" rx="14" class="box verify"/><text x="1318" y="542" class="h1">Ratify + policy</text><text x="1318" y="570" class="p">Verify one snapshot</text>
  <rect x="1290" y="630" width="220" height="72" rx="14" class="handler"/><text x="1318" y="660" class="h1 white">Protected handler</text><text x="1318" y="684" class="p white">ALLOW only</text>

  <path d="M770 490 C820 490 865 270 947 270" class="line"/>
  <circle cx="825" cy="420" r="16" fill="#fff" stroke="#566176" stroke-width="2"/><text x="820" y="426" class="step">1</text><text x="850" y="425" class="step">BIND</text>
  <path d="M770 540 C825 540 870 410 947 410" class="line"/>
  <circle cx="825" cy="505" r="16" fill="#fff" stroke="#566176" stroke-width="2"/><text x="820" y="511" class="step">2</text><text x="850" y="510" class="step">PRESENT</text>
  <path d="M770 585 C825 585 870 550 947 550" class="line"/>
  <circle cx="825" cy="575" r="16" fill="#fff" stroke="#566176" stroke-width="2"/><text x="820" y="581" class="step">3</text><text x="850" y="580" class="step">CALL</text>

  <path d="M1255 410 L1282 410" class="line"/>
  <path d="M1255 550 C1275 550 1275 455 1290 455" class="line"/>
  <path d="M1400 455 L1400 497" class="line"/>
  <path d="M1400 595 L1400 622" class="allowLine"/>
  <path d="M1310 595 C1295 625 1275 625 1255 590" class="denyLine"/>
  <text x="955" y="685" class="step">DENY: stable reason • handler unchanged</text>

  <rect x="70" y="810" width="18" height="18" rx="4" class="accent"/><text x="100" y="824" class="small">Ratify authority construction</text>
  <rect x="350" y="810" width="18" height="18" rx="4" class="verify"/><text x="380" y="824" class="small">Receiver-owned authorization</text>
  <rect x="655" y="810" width="18" height="18" rx="4" class="handler"/><text x="685" y="824" class="small">Protected business effect</text>
</svg>
