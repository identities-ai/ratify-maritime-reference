[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratify-maritime-reference"
version = "0.1.0"
description = "Authority-aware agent reference for Maritime"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-mcp-adapters>=0.3,<1",
  "langchain-openai>=1,<2",
  # langchain-mcp-adapters currently targets the maintained MCP v1 line.
  "mcp>=1.28,<2",
  # Protocol v2 lives at ratify_protocol.v2; the protocol-v2 extra pulls in
  # the ratify-protocol-native-v2 signing backend at the same version.
  "ratify-protocol[protocol-v2]==2.0.0b1",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/maritime_ratify"]
