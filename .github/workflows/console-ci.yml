name: CI

# Verification for the demo console. This repository had no automated checks for
# it: pull requests touching the console merged on whatever their author happened
# to run locally, and the change that made the routed-host gate configurable
# reached review with no test covering the new behaviour.
#
# The gate is the console's access control. It has no public route of its own and
# answers only requests arriving on an allowed hostname with the router
# credential, so a regression there exposes the console rather than breaking it,
# which is the kind of failure a green build hides.
#
# The scenario proxy is covered here too. It had no automated checks at all: its
# tests ran only where someone remembered to run them, while it is the component
# every public request passes through and the only thing holding the demo
# credentials and the console-origin gate.
#
# So was the Python package, which is the whole reference: the receiver that
# makes every authorization decision, the agent, the issuance command that
# rotates deployment authority, and the gate scripts. None of it ran in CI. A
# broken gate script reached main that way, parsing cleanly and failing only
# when a person ran it.
#
# This workflow does not deploy. Deployment is scoped in
# docs/CONSOLE-WORKER-MIGRATION.md and needs its own review.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'apps/**'
      - 'docs/gate-expectations.json'
      - 'docs/runtime-isolation-expectations.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/console-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'apps/**'
      - 'docs/gate-expectations.json'
      - 'docs/runtime-isolation-expectations.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/console-ci.yml'

permissions:
  contents: read

concurrency:
  group: console-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/demo-console/site

jobs:
  verify:
    name: Verify console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/demo-console/site/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      # Builds, then runs every file in tests/. The script previously named a
      # single file, so a new test file was collected by nobody and would have
      # passed by not running.
      - name: Build and test
        run: npm test

      # The suite is small enough that a silent drop matters. A skipped or
      # vanished test is a green build with less evidence behind it.
      - name: No test may be skipped
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs 2>&1 | tee test.log
          skipped=$(sed -n 's/^# skipped \([0-9]\+\)$/\1/p' test.log | tail -1)
          todo=$(sed -n 's/^# todo \([0-9]\+\)$/\1/p' test.log | tail -1)
          test "${skipped:-0}" = 0 || { echo "::error::${skipped} test(s) skipped"; exit 1; }
          test "${todo:-0}" = 0 || { echo "::error::${todo} test(s) marked todo"; exit 1; }

      # Wrangler's output format is parsed by deployment tooling, so an
      # unintended major or minor change should fail here rather than surface as
      # a deployment check that silently stops checking.
      - name: Wrangler stays pinned
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').devDependencies.wrangler")
          test "$declared" = "4.127.1" || {
            echo "::error::wrangler must be pinned exactly, found '$declared'"; exit 1;
          }
          installed=$(node -p "require('wrangler/package.json').version")
          test "$installed" = "4.127.1" || {
            echo "::error::installed wrangler is $installed"; exit 1;
          }

      # No dependency-advisory gate yet, deliberately. The console currently has
      # high-severity advisories that `npm audit fix` cannot resolve without a
      # forced major upgrade. Adding a gate that is red on its first run trains
      # people to ignore red. Clear the advisories in their own change, then add
      # the gate, which is the order the catalog repository used.

  verify-reference:
    name: Verify Python reference
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Test
        run: uv run --python 3.12 pytest -q

      # The gate scripts and the shared contracts are the reference's public
      # surface. A skipped test there is a green build over less evidence, and
      # the contracts are read by three separate runners that must not drift.
      - name: Every reference test must run
        run: |
          set -euo pipefail
          uv run --python 3.12 pytest -q --no-header 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          tail -1 "$RUNNER_TEMP/pytest.log" | grep -qE '^[0-9]+ passed' || {
            echo "::error::pytest did not report a clean pass"; exit 1;
          }
          if grep -qE '[0-9]+ (skipped|xfailed|error)' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::a reference test was skipped, xfailed, or errored"
            exit 1
          fi

      # Only the evidence check, because the toolchain checks belong to the
      # jobs that install their own dependencies.
      - name: Recorded evidence stays complete
        run: python3 scripts/run_acceptance_gate.py --evidence-only

  verify-proxy:
    name: Verify scenario proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-console/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/demo-console/worker/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The proxy's suite covers the origin gate, the rate limiter, credential
      # isolation between the two runtimes, and the fail-closed response
      # validation. A silently dropped test there is a green build over a
      # weaker boundary, so an empty or shrinking run fails.
      - name: Every proxy test must run
        run: |
          set -euo pipefail
          npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/proxy-tests.json" >/dev/null
          node -e '
            const run = require(process.env.RUNNER_TEMP + "/proxy-tests.json");
            const { numTotalTests: total, numPendingTests: pending, numTodoTests: todo } = run;
            if (pending) { console.error(`::error::${pending} proxy test(s) skipped`); process.exit(1); }
            if (todo) { console.error(`::error::${todo} proxy test(s) marked todo`); process.exit(1); }
            if (total < 50) {
              console.error(`::error::expected at least 50 proxy tests, ran ${total}`);
              process.exit(1);
            }
            console.log(`${total} proxy tests ran with none skipped`);
          '
