name: Demo credential watch

# The deployed authority lives seven days. When it lapses every scenario fails,
# including the allow case, while the console keeps serving and returning 200,
# so nothing surfaces the outage until a visitor clicks something. That is how
# the demonstration spent 2026-09-10 to 09-11 down without anyone noticing.
#
# This runs the same public path a visitor uses, reads the delegation expiry the
# proxy reports, and fails while there is still time to rotate. It also runs the
# revoked scenario, because a renewal that skips the receiver's revocation list
# leaves that case returning ALLOW with nothing else looking wrong.
#
# No secrets. The endpoint and its origin are public, and the job reads a
# decision rather than issuing anything.

on:
  schedule:
    # Daily. Two days of warning covers a weekend at a seven day life.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Fail when fewer than this many days remain'
        required: false
        default: '2'

permissions:
  contents: read

concurrency:
  group: demo-credential-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check the deployed credential
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Probe the public scenario path
        run: |
          python3 scripts/watch_demo_credential.py \
            --warn-days "${{ github.event.inputs.warn_days || '2' }}"
