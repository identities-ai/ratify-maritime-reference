name: Publish reviewed agent image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_REVISION: d507cd9c1d0801b2e1a9e6a001cd65bc67e433c3
  IMAGE: ghcr.io/identities-ai/ratify-maritime-agent:d507cd9

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build reviewed agent
        run: |
          docker build \
            --no-cache \
            --label org.opencontainers.image.source=https://github.com/identities-ai/ratify-maritime-reference \
            --label org.opencontainers.image.revision="$SOURCE_REVISION" \
            --platform linux/amd64 \
            -t "$IMAGE" .

      - name: The image must carry no authority material
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint sh "$IMAGE" -c 'ls /app/deployment' 2>/dev/null; then
            echo "::error::the image still bakes authority material"; exit 1
          fi
          echo "image carries no authority material"

      - name: Publish immutable revision tag
        run: docker push "$IMAGE"

      - name: Record published digest
        run: docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE"

      - name: Remove registry credential
        if: always()
        run: docker logout ghcr.io
