name: Publish reviewed agent image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_REVISION: f3c58b47e9a3200e9e178553cefae57b714c9477
  DELEGATION_SHA256: e0d637c0024dd81c0f4769520c35f030997e71b854795a7c7628a3a1d2860be0
  SCENARIO_AUTHORITIES_SHA256: 763e5a13dd84854b59274babd47c137ca7858c17b2316641b99d026d62125b4c
  SECOND_DELEGATION_SHA256: 418ae1e6b6cb5e88be00f2d66bb565d90e4ed23335413dcd5d59f08204d5b99a
  PEER_AUTHORITIES_SHA256: 862b6c90e042f05605fee45fd3a646cb4266dcaf4457c10f1fd522efe41d38a0
  IMAGE: ghcr.io/identities-ai/ratify-maritime-agent:f3c58b4

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Require deployment delegation
        env:
          RATIFY_DEPLOYMENT_DELEGATION_B64: ${{ secrets.RATIFY_DEPLOYMENT_DELEGATION_B64 }}
          RATIFY_SCENARIO_AUTHORITIES_GZIP_B64: ${{ secrets.RATIFY_SCENARIO_AUTHORITIES_GZIP_B64 }}
          RATIFY_DEPLOYMENT_DELEGATION_B_B64: ${{ secrets.RATIFY_DEPLOYMENT_DELEGATION_B_B64 }}
          RATIFY_PEER_AUTHORITIES_GZIP_B64: ${{ secrets.RATIFY_PEER_AUTHORITIES_GZIP_B64 }}
        run: |
          test -n "$RATIFY_DEPLOYMENT_DELEGATION_B64"
          test -n "$RATIFY_SCENARIO_AUTHORITIES_GZIP_B64"
          test -n "$RATIFY_DEPLOYMENT_DELEGATION_B_B64"
          test -n "$RATIFY_PEER_AUTHORITIES_GZIP_B64"

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build reviewed agent
        env:
          RATIFY_DEPLOYMENT_DELEGATION_B64: ${{ secrets.RATIFY_DEPLOYMENT_DELEGATION_B64 }}
          RATIFY_SCENARIO_AUTHORITIES_GZIP_B64: ${{ secrets.RATIFY_SCENARIO_AUTHORITIES_GZIP_B64 }}
          RATIFY_DEPLOYMENT_DELEGATION_B_B64: ${{ secrets.RATIFY_DEPLOYMENT_DELEGATION_B_B64 }}
          RATIFY_PEER_AUTHORITIES_GZIP_B64: ${{ secrets.RATIFY_PEER_AUTHORITIES_GZIP_B64 }}
        run: |
          docker build \
            --no-cache \
            --secret id=ratify_delegation_b64,env=RATIFY_DEPLOYMENT_DELEGATION_B64 \
            --secret id=ratify_scenario_authorities_gzip_b64,env=RATIFY_SCENARIO_AUTHORITIES_GZIP_B64 \
            --secret id=ratify_delegation_b_b64,env=RATIFY_DEPLOYMENT_DELEGATION_B_B64 \
            --secret id=ratify_peer_authorities_gzip_b64,env=RATIFY_PEER_AUTHORITIES_GZIP_B64 \
            --build-arg RATIFY_DELEGATION_SHA256="$DELEGATION_SHA256" \
            --build-arg RATIFY_SCENARIO_AUTHORITIES_SHA256="$SCENARIO_AUTHORITIES_SHA256" \
            --build-arg RATIFY_SECOND_DELEGATION_SHA256="$SECOND_DELEGATION_SHA256" \
            --build-arg RATIFY_PEER_AUTHORITIES_SHA256="$PEER_AUTHORITIES_SHA256" \
            --label org.opencontainers.image.source=https://github.com/identities-ai/ratify-maritime-reference \
            --label org.opencontainers.image.revision="$SOURCE_REVISION" \
            --label com.ratifyprotocol.delegation.sha256="$DELEGATION_SHA256" \
            --platform linux/amd64 \
            -t "$IMAGE" .

      - name: Verify embedded delegation
        run: |
          test "$(docker run --rm --entrypoint sha256sum "$IMAGE" /app/deployment/delegation.json | cut -d ' ' -f 1)" = "$DELEGATION_SHA256"
          test "$(docker run --rm --entrypoint sha256sum "$IMAGE" /app/deployment/scenario-authorities.json | cut -d ' ' -f 1)" = "$SCENARIO_AUTHORITIES_SHA256"
          test "$(docker run --rm --entrypoint sha256sum "$IMAGE" /app/deployment/delegation-b.json | cut -d ' ' -f 1)" = "$SECOND_DELEGATION_SHA256"
          test "$(docker run --rm --entrypoint sha256sum "$IMAGE" /app/deployment/scenario-authorities-b.json | cut -d ' ' -f 1)" = "$PEER_AUTHORITIES_SHA256"

      - name: Publish immutable revision tag
        run: docker push "$IMAGE"

      - name: Record published digest
        run: docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE"

      - name: Remove registry credential
        if: always()
        run: docker logout ghcr.io
