# Keep workflow actions current.
#
# Added after checkout and setup-node were found still pinned to v4, whose Node
# 20 runtime is deprecated: the runner had begun forcing them onto Node 24 and
# warning on every run. Nothing was watching for that, so a deprecation
# announced in advance surfaced as a warning nobody owned.
#
# Actions only. The npm tree moves far more often, and a flood of dependency
# pull requests is how a repository learns to ignore them.
# Weekly rather than monthly. Monthly is how several actions here ended up
# multiple majors behind: a deprecation announced in advance had a month to sit
# unnoticed, and by the time anything surfaced the fix was a batch rather than a
# single bump. Actions change rarely enough that weekly is a small queue.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
